name: audio_transcriber
description: "AudioTranscriber - app Flutter para gravar e transcrever áudio."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.3.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  speech_to_text: ^7.3.0
  record: ^6.1.1
  file_picker: ^8.1.6
  share_plus: ^10.1.2
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
